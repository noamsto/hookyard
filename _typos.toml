[default]
# This repo quotes a lot of git revisions and sha256 digests verbatim as
# evidence, and hex runs read as misspellings ("6caf4ff" -> "calf").
extend-ignore-re = ["\\b[0-9a-f]{7,64}\\b"]

[default.extend-words]
# Deliberate: the misspelled Claude Code event that catalog validation must refuse.
Notifcation = "Notifcation"

[files]
# d2-rendered SVGs: mixed-case hex color fragments in generated CSS class
# names (e.g. "f38BA8") aren't prose and aren't worth hand-tuning regexes for.
# internal/serve/assets/flow/*: committed esbuild output, not prose.
# internal/serve/web/package-lock.json: npm-generated, not hand-edited.
extend-exclude = [
  "docs/diagrams/*.svg",
  "internal/serve/assets/flow/*",
  "internal/serve/web/package-lock.json",
]
