# Write-time redaction rules (memory-layer §4.3). A match refuses the write;
# reports name the rule id, never the matched text. Patterns are RE2.

[[rule]]
id = "private-key"
regex = '-----BEGIN [A-Z ]*PRIVATE KEY-----'

[[rule]]
id = "aws-access-key-id"
regex = '\b(AKIA|ASIA)[0-9A-Z]{16}\b'

[[rule]]
id = "github-token"
regex = '\b(ghp|gho|ghs|ghr|ghu)_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{22,}'

[[rule]]
id = "slack-token"
regex = '\bxox[abposr]-[A-Za-z0-9-]{10,}'

[[rule]]
id = "anthropic-key"
regex = '\bsk-ant-[A-Za-z0-9_-]{20,}'

[[rule]]
id = "openai-key"
regex = '\bsk-(proj-)?[A-Za-z0-9]{20,}'

[[rule]]
id = "stripe-live-key"
regex = '\b[rs]k_live_[A-Za-z0-9]{16,}'

[[rule]]
id = "google-api-key"
regex = '\bAIza[0-9A-Za-z_-]{35}\b'

[[rule]]
id = "jwt"
regex = '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'

[[rule]]
id = "generic-assignment"
regex = '''(?i)\b(api[_-]?key|secret|token|passw(or)?d)\s*[:=]\s*['"]?[A-Za-z0-9/+_\-]{16,}'''
