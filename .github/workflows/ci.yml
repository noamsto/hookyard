name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # No magic-nix-cache: it now requires a FlakeHub account and fails to
      # authenticate on a plain public repo, adding a red annotation for a
      # build this small does not need.
      - name: flake check
        run: nix flake check

  # nix flake check does not run this repo's `gotest`/`golangci-lint`
  # pre-commit hooks -- both are staged "pre-push" only, and the
  # `pre-commit` flake check runs `pre-commit run --all-files` with the
  # default stage "pre-commit", which skips them. Run them explicitly so
  # Go tests and lint actually gate CI. Outside the sandbox, so the Go build
  # and lint caches can carry over between runs.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'flake.lock') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum', 'flake.lock') }}-
            go-${{ runner.os }}-
      - name: go test
        run: nix develop -c go test -race ./...
      - name: golangci-lint
        run: nix develop -c golangci-lint run ./...
      - name: golangci-lint (priorstest)
        run: nix develop -c golangci-lint run --build-tags priorstest ./cmd/priors/...
      - name: nilaway
        run: nix develop -c nilaway -include-pkgs=github.com/noamsto/hookyard ./...

  # Builds the packages the Home Manager module installs, for Linux and macOS,
  # and pushes them to dispatcher.cachix.org so downstream rebuilds substitute
  # them. Pushes from main only, and PR runs never get the token: every host
  # trusts this cache, so a PR branch's build must never land in it. The cache
  # is public, so PR runs still pull.
  cache:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: dispatcher
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' }}
      - run: nix build .#hookyard .#priors --no-link
