<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookyard serve</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/flow/flow.css">
</head>
<body data-view="feed">
<header class="topbar">
  <div class="brand">hookyard <span id="state-dir" class="state-dir dim"></span></div>
  <div class="view-toggle" role="tablist" aria-label="view">
    <button type="button" role="tab" data-view="feed" aria-selected="true">feed</button>
    <button type="button" role="tab" data-view="flow" aria-selected="false">flow</button>
  </div>

  <!-- The drill trail: every active filter value in the order it was added,
       each a step back to that level; the session search types into it. -->
  <nav id="trail" class="trail" aria-label="drill path">
    <button type="button" id="trail-back" class="trail-back" title="back one level (Backspace)" aria-label="back one level" hidden>←</button>
    <button type="button" id="trail-root" class="crumb-root">all calls</button>
    <div id="filter-chips" class="filter-chips" aria-live="polite"></div>
    <label class="trail-search">
      <span class="sr-only">session</span>
      <input id="f-session" name="session" type="text" placeholder="session id…" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <button type="button" id="clear-filters" class="trail-clear" title="clear the drill path and the session search (Esc)" hidden>clear</button>
  </nav>

  <div class="filter-add">
    <button type="button" id="filter-add-toggle" aria-expanded="false" aria-controls="filters">+ filter</button>
    <form id="filters" class="filter-pop" autocomplete="off" hidden>
      <label for="f-engine">engine</label>
      <select id="f-engine" data-field="engine"><option value="">+ engine</option></select>
      <label for="f-event">event</label>
      <select id="f-event" data-field="event"><option value="">+ event</option></select>
      <label for="f-handler">handler</label>
      <select id="f-handler" data-field="handler"><option value="">+ handler</option></select>
      <label for="f-outcome">handler outcome</label>
      <select id="f-outcome" data-field="outcome"><option value="">+ handler outcome</option></select>
      <label for="f-verdict">call verdict</label>
      <select id="f-verdict" data-field="verdict"><option value="">+ call verdict</option></select>
    </form>
  </div>

  <label class="day-picker">
    <span class="sr-only">day</span>
    <select id="day-select"></select>
  </label>
  <div id="conn" class="conn" data-state="static">
    <span class="conn-dot"></span><span class="conn-label">static</span>
  </div>
  <button type="button" id="focus-toggle" class="icon-btn" title="focus mode: hide the chrome (f)" aria-label="focus mode" aria-pressed="false">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</header>
<button type="button" id="focus-exit" class="focus-exit" title="leave focus mode (f or Esc)">exit focus</button>

<main class="body">
  <section class="panel feed-panel">
    <div class="panel-header">
      <h2>feed</h2>
      <span id="feed-count" class="dim"></span>
      <span id="feed-windowed" class="dim" hidden>windowed &mdash; more via load older</span>
    </div>
    <ol id="feed" class="feed"></ol>
    <div class="feed-footer">
      <button type="button" id="load-older">load older</button>
    </div>
  </section>

  <section class="panel flow-panel" id="flow-panel" hidden></section>

  <aside id="flow-details" class="panel details-panel" aria-label="details for the current drill level" hidden></aside>

  <aside class="side">
    <section class="panel stats-panel">
      <div class="panel-header">
        <h2>counts</h2>
        <span id="stats-day" class="dim"></span>
      </div>
      <p class="hint">unfiltered — describes the whole day, not the feed above</p>
      <div id="stats-body"></div>
    </section>

    <section class="panel table-panel">
      <div class="panel-header">
        <h2>handler table</h2>
      </div>
      <div id="table-body"></div>
    </section>
  </aside>
</main>

<template id="row-template">
  <li class="row">
    <div class="row-main" tabindex="0" role="button" aria-expanded="false">
      <span class="c-time"></span>
      <span class="c-engine"></span>
      <span class="c-key"></span>
      <span class="c-event"></span>
      <span class="c-tool"></span>
      <span class="c-verdict"></span>
      <span class="c-enforced"></span>
      <span class="c-handlers"></span>
    </div>
    <div class="row-detail" hidden>
      <dl>
        <dt>session</dt><dd class="d-session"></dd>
        <dt>cwd</dt><dd class="d-cwd"></dd>
        <dt>reason</dt><dd class="d-reason"></dd>
      </dl>
      <div class="d-handlers"></div>
    </div>
  </li>
</template>

<template id="handler-chip-template">
  <span class="chip">
    <span class="chip-name"></span><span class="chip-ms"></span>
  </span>
</template>

<template id="handler-detail-template">
  <div class="handler-detail">
    <div class="handler-detail-head">
      <span class="hd-name"></span>
      <span class="hd-outcome"></span>
      <span class="hd-ms"></span>
    </div>
    <div class="hd-advice"></div>
    <div class="hd-message"></div>
  </div>
</template>

<template id="divider-template">
  <li class="divider"><span></span></li>
</template>

<script type="module" src="/static/app.js"></script>
<script type="module" src="/static/flow/flow.js"></script>
</body>
</html>
