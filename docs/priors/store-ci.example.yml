# Example required check for a priors store repository (personal or work).
# Copy to .github/workflows/lint.yml in the store repo and make the `lint`
# job a required status check on its default branch: a client pre-commit can
# be skipped with --no-verify and git hooks are not cloned, so the remote is
# where the lint actually holds (docs/design/memory-layer.md §4.3, §4.4).
#
# Set STORE_KIND to "personal" or "work". A personal store must also set the
# PRIORS_WORK_ORG repository variable (host/owner, e.g. github.com/<org>) so a
# fact naming the work org fails the check. It is read from a variable, not
# written here, so the work org's name never enters the personal store's
# history (R9); the check refuses to run without it.
name: lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STORE_KIND: personal
      WORK_ORG: ${{ vars.PRIORS_WORK_ORG }}
      # Pin hookyard to a revision and bump it deliberately: an unpinned
      # flake ref would let any change on hookyard's main turn every store's
      # required check red at once.
      PRIORS_REF: github:noamsto/hookyard/<rev>#priors
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      # Full history: the entry-deletion and per-commit checks read the pushed
      # range, which a shallow clone does not hold.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      # priors comes wrapped with git, ripgrep and betterleaks on its PATH,
      # so the gate:secret scan runs with nothing else to install.
      - name: priors lint
        run: |
          args=(lint --dir . --kind "$STORE_KIND")
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            SINCE="$PR_BASE_SHA"
          elif [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # After a force-push the old tip is in no clone, so --since fails
            # the check by design: a rewrite can hide an entry deletion. An
            # admin re-runs the check after reviewing the rewrite.
            SINCE="$PUSH_BEFORE"
          fi
          if [ -n "${SINCE:-}" ]; then
            args+=(--since "$SINCE")
          fi
          if [ "$STORE_KIND" = personal ]; then
            test -n "$WORK_ORG" || { echo "set the PRIORS_WORK_ORG repository variable"; exit 1; }
            args+=(--work-org "$WORK_ORG")
          fi
          nix run "$PRIORS_REF" -- "${args[@]}"
